<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify your Email</title>
</head>
<body>
  <h2 style="text-align: center;">Welcome to School Portal</h2>

  <p>Hello, {{ user.first_name }},</p>

  <p>Thank you for resgistering. Use the verification code below to verify your email.</p>

  <h1>{{verification_code}}</h1>

  <p>This code expires in 10 minutes</p>

  <p style="color: hsl(0, 0%, 30%);">If you did not create this account, you can ignore this email.</p>
</body>
</html>
